set -g mouse on
set -g aggressive-resize on

# Prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# General
set -g default-terminal "screen-256color"
set -sa terminal-overrides ",xterm*:Tc"
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g status-position bottom
set -g escape-time 1
set -g detach-on-destroy off

# Panes (hjkl)
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Windows
bind -r H previous-window
bind -r L next-window

# Sessions
bind -r J switch-client -n
bind -r K switch-client -p

set -g repeat-time 600

# Rename pane
bind P command-prompt -p "Rename pane:" "select-pane -T '%%'"

# Rename session
bind S command-prompt -p "Rename session:" "rename-session '%%'"

# Kill sans confirmation
bind x kill-pane
bind & kill-window

# Split (keep path)
bind "'" split-window -v -c "#{pane_current_path}"
bind '\' split-window -h -c "#{pane_current_path}"

# Copy mode vi
set -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe "pbcopy"

# Design system
set -g @color-active    "cyan"
set -g @color-inactive  "brightblack"
set -g @color-text      "white"
set -g @color-separator "black"
set -g @color-warning   "yellow"
set -g @color-success   "green"
set -g @color-danger    "red"
set -g @color-info      "brightblue"
set -g @color-accent    "brightcyan"

# Pane border
set -g pane-border-style 'fg=default'
set -g pane-active-border-style 'fg=default'
set -g pane-border-status top
run-shell '~/.local/bin/pane-border-format.sh'

# Statusbar transparente powerline
set -g status-style 'bg=default,fg=#{@color-text}'
set -g status-left '#[fg=#{@color-active}] #[fg=#{@color-text},dim]#{?#{!=:#S,},#S ,}#[fg=#{@color-active}]#(tmux list-sessions | grep -n "^$(echo #S):" | cut -d: -f1)#[fg=#{@color-inactive}]/#(tmux list-sessions | wc -l | tr -d " ") #[fg=#{@color-separator}]▎ '
set -g status-left-length 30
set -g status-right '#(~/.local/bin/pane-stats-update.sh)#{?client_prefix,#[fg=#{@color-warning}]⌨ ,}#{?window_zoomed_flag,#[fg=#{@color-warning}]󰍉  ,}#[fg=#{@color-inactive},dim]#{online_status} #{battery_icon_status} #{battery_percentage}  󰍛 #{cpu_percentage}  󰘚 #{ram_percentage}  #[fg=#{@color-inactive}]󰅐 %d/%m  %H:%M'
set -g status-right-length 80
set -g status-justify left

set -g window-status-format '#[fg=#{@color-inactive}] #I #{?#{@notif},#[fg=#{@color-warning}]󱅫 ,}#{?#{>:#{window_panes},1},#[fg=#{@color-info}]󰕮 ,}#[fg=#{@color-text}]#{?#{||:#{==:#{pane_current_command},zsh},#{||:#{==:#{pane_current_command},bash},#{==:#{pane_current_command},fish}}},󰉋 #{b:pane_current_path},#{pane_current_command}  󰉋 #{b:pane_current_path}}'
set -g window-status-current-format '#[fg=#{@color-active}] #I #{?#{>:#{window_panes},1},#[fg=#{@color-info}]󰕮 ,}#{?window_zoomed_flag,#[fg=#{@color-warning}]󰍉 ,}#[fg=#{@color-text},bold]#{?#{||:#{==:#{pane_current_command},zsh},#{||:#{==:#{pane_current_command},bash},#{==:#{pane_current_command},fish}}},󰉋 #{b:pane_current_path},#{pane_current_command}  󰉋 #{b:pane_current_path}}'
set -g window-status-style dim
set -g window-status-current-style nodim
set -g window-status-separator '#[fg=#{@color-separator}] │ '



# Pane stats -- update @pane_cpu and @pane_mem on active pane
set-hook -g pane-focus-in 'run-shell -b "~/.local/bin/pane-stats-update.sh"'

# Notification bell -- clear on window focus
set-hook -g after-select-window 'set-option -w @notif ""'
set-hook -g after-select-pane 'set-option -w @notif ""'

# Plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Plugin config
set -g @online_icon '#[fg=green]'
set -g @offline_icon '#[fg=red]'
set -g @batt_icon_status_charged '#[fg=green]󰁹'
set -g @batt_icon_status_charging '#[fg=green]󰂄'
set -g @batt_icon_status_discharging '#[fg=white]󰁾'
set -g @batt_icon_status_attached '#[fg=yellow]󰂃'
set -g @batt_icon_status_unknown '#[fg=brightblack]󰁹'
set -g @cpu_percentage_format '%2.0f%%'
set -g @ram_percentage_format '%2.0f%%'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

run 'tmux set-environment -g PATH "$PATH"'
run '~/.tmux/plugins/tpm/tpm'
