set -g mouse on
set -g aggressive-resize on

# Prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# General
set -g default-terminal "screen-256color"
set -sa terminal-overrides ",xterm*:Tc"
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g status-position bottom
set -g escape-time 1
set -g detach-on-destroy off

# Panes (hjkl)
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Windows
bind -r H previous-window
bind -r L next-window

# Sessions
bind -r J switch-client -n
bind -r K switch-client -p

set -g repeat-time 600

# Kill sans confirmation
bind x kill-pane
bind & kill-window

# Split (keep path)
bind "'" split-window -v -c "#{pane_current_path}"
bind '\' split-window -h -c "#{pane_current_path}"

# Copy mode vi
set -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe "pbcopy"

# Pane border
set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'fg=colour141'
set -g pane-border-status top
set -g pane-border-format '#{?pane_active,#[fg=colour141]●,}'

# Statusbar transparente powerline
set -g status-style 'bg=default,fg=white'
set -g status-left '#[fg=colour141,bold] #(/opt/homebrew/bin/tmux list-sessions | grep -n "^$(echo #S):" | cut -d: -f1)#[fg=colour240]/#[fg=colour141]#(/opt/homebrew/bin/tmux list-sessions | wc -l | tr -d " ") '
set -g status-left-length 30
set -g status-right ''
set -g status-justify left

set -g window-status-format '#[fg=colour240] #I #T '
set -g window-status-current-format '#[fg=colour141,bold] #I #[fg=colour183]#T #[fg=colour141]'
set -g window-status-separator ''

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

run '~/.tmux/plugins/tpm/tpm'
