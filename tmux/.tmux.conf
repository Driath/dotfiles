set -g mouse on
set -g aggressive-resize on

# Prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# General
set -g default-terminal "screen-256color"
set -sa terminal-overrides ",xterm*:Tc"
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g status-position bottom
set -g escape-time 1
set -g detach-on-destroy off

# Panes (hjkl)
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Windows
bind -r H previous-window
bind -r L next-window

# Sessions
bind -r J switch-client -n
bind -r K switch-client -p

set -g repeat-time 600

# Rename pane
bind P command-prompt -p "Rename pane:" "select-pane -T '%%'"

# Rename session
bind S command-prompt -p "Rename session:" "rename-session '%%'"

# Kill sans confirmation
bind x kill-pane
bind & kill-window

# Split (keep path)
bind "'" split-window -v -c "#{pane_current_path}"
bind '\' split-window -h -c "#{pane_current_path}"

# Copy mode vi
set -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe "pbcopy"

# Pane border
set -g pane-border-style 'fg=default'
set -g pane-active-border-style 'fg=default'
set -g pane-border-status top
set -gw pane-border-format '#{?pane_active,#[fg=cyan]● #[fg=brightcyan]#W #[fg=brightblack] #{pane_current_path}  #T #[fg=cyan]●,#[fg=brightblack]○ #T }'

# Statusbar transparente powerline
set -g status-style 'bg=default,fg=white'
set -g status-left '#[fg=cyan,bold] #(/opt/homebrew/bin/tmux list-sessions | grep -n "^$(echo #S):" | cut -d: -f1)#[fg=brightblack]/#[fg=cyan]#(/opt/homebrew/bin/tmux list-sessions | wc -l | tr -d " ") #[fg=black]│ '
set -g status-left-length 30
set -g status-right '#[fg=brightblack] %H:%M'
set -g status-justify left

set -g window-status-format '#{?#{>:#{window_panes},1},#[fg=white]󰕮 ,}#[fg=white] #I #T'
set -g window-status-current-format '#{?#{>:#{window_panes},1},#[fg=cyan]󰕮 ,}#[fg=cyan,bold] #I #[fg=brightcyan]#T#[fg=cyan]'
set -g window-status-separator '#[fg=black]│'

# Plugins
set -g @plugin 'tmux-plugins/tpm'

run '~/.tmux/plugins/tpm/tpm'
