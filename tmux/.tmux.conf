set -g mouse on
set -g aggressive-resize on

# Prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# General
set -g default-terminal "tmux-256color"
set -sa terminal-overrides ",xterm*:Tc"
set -s extended-keys on
set -as terminal-features ',xterm*:extkeys'
set -as terminal-features ',ghostty:extkeys'
set -as terminal-features ',xterm-ghostty:RGB:strikethrough:usstyle:overline:extkeys'

# Kitty keyboard protocol (tmux next-3.7 PR #4912)
set -s kitty-keys on

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g status-position bottom
set -g escape-time 1
set -g focus-events on
set -g detach-on-destroy off

# Panes (hjkl)
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Windows
bind -r H previous-window
bind -r L next-window

# Sessions
bind -r J switch-client -n
bind -r K switch-client -p

# Swap windows
bind -r '{' swap-window -t -1 \; select-window -t -1
bind -r '}' swap-window -t +1 \; select-window -t +1

# Move window to another session
bind B run-shell -b '~/.local/bin/move-window-to-session.sh prev'
bind F run-shell -b '~/.local/bin/move-window-to-session.sh next'

# Swap panes
bind -r < swap-pane -s '{left-of}'
bind -r > swap-pane -s '{right-of}'
bind -r + swap-pane -s '{up-of}'
bind -r _ swap-pane -s '{down-of}'

set -g repeat-time 600

# Minimum pane size (40 columns)
set-hook -g after-resize-pane 'run-shell -b "~/.local/bin/pane-min-width.sh"'

# New session
bind N new-session

# Cmd+E: Neovim = file tree, shell = broot
bind -n M-e if-shell "tmux display-message -p '#{pane_current_command}' | grep -qE 'nvim|claude'"     "send-keys M-e"     "send-keys 'br
'"

# Cmd+P: Neovim = find files, shell = fzf (Ctrl+T)
bind -n M-p if-shell "tmux display-message -p '#{pane_current_command}' | grep -q nvim"     "send-keys M-p"     "send-keys C-t"


# Ghostty theme cycling
bind G run-shell -b '~/.local/bin/ghostty-theme-cycle.sh next'
bind Y run-shell -b '~/.local/bin/ghostty-theme-cycle.sh prev'

# Smart clipboard paste
bind V run-shell -b '~/.local/bin/clipboard-paste-tmux.sh'

# Speech-to-text
bind m run-shell -b '~/.local/bin/speech-to-text.sh'

# Rename pane
bind P command-prompt -p "Rename pane:" "select-pane -T '%%'"

# Rename session
bind S command-prompt -p "Rename session:" "rename-session '%%'"

# Kill sans confirmation
bind x kill-pane
bind & kill-window

# Split (keep path)
bind "'" split-window -v -c "#{pane_current_path}"
bind '\' split-window -h -c "#{pane_current_path}"

# Copy mode vi
set -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe "pbcopy"

# Design system
set -g @color-active    "cyan"
set -g @color-inactive  "brightblack"
set -g @color-text      "white"
set -g @color-separator "white"
set -g @color-warning   "yellow"
set -g @color-success   "green"
set -g @color-danger    "red"
set -g @color-info      "brightblue"
set -g @color-accent    "brightcyan"

# Pane border
set -g pane-border-style 'fg=#{@color-inactive}'
set -g pane-active-border-style 'fg=#{@color-inactive}'
set -g pane-border-status top
run-shell '$SHELL -lc "~/.local/bin/pane-border-format.sh"'

# Statusbar transparente powerline
set -g status-style 'bg=default,fg=#{@color-text}'
set -g status-left-length 30
set -g status-right-length 70
set -g status-justify left
set -g window-status-style dim
set -g window-status-current-style nodim
set -g window-status-bell-style dim
set -g window-status-activity-style dim
set -g window-status-separator '#[fg=#{@color-separator}] │ '
run-shell '$SHELL -lc "~/.local/bin/statusbar-format.sh"'

# Notification bell -- increment on bell, clear on focus
set-hook -g alert-bell 'run-shell -b "~/.local/bin/notif-increment.sh"'
set-hook -g after-select-window 'set-option -w @notif ""'
set-hook -g after-select-pane 'set-option -w @notif ""'
set-hook -ga after-select-pane 'run-shell -b "~/.local/bin/pane-stats-update.sh"'
run-shell -b '~/.local/bin/pane-stats-update.sh'

# Plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Plugin config
set -g @online_icon '#[fg=green]󰤨'
set -g @offline_icon '#[fg=red]󰤭'
set -g @batt_icon_status_charged '#[fg=green]󰁹'
set -g @batt_icon_status_charging '#[fg=green]󰂄'
set -g @batt_icon_status_discharging '#[fg=white]󰁾'
set -g @batt_icon_status_attached '#[fg=yellow]󰂃'
set -g @batt_icon_status_unknown '#[fg=brightblack]󰁹'
set -g @cpu_percentage_format '%d%%'
set -g @ram_percentage_format '%d%%'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

run '$SHELL -lc "~/.tmux/plugins/tpm/tpm"'

# Session index -- update @session_index on session changes (after TPM to append to gitmux hooks)
set-hook -ga session-created 'run-shell -b "~/.local/bin/session-index.sh"'
set-hook -ga session-closed 'run-shell -b "~/.local/bin/session-index.sh"'
set-hook -ga client-session-changed 'run-shell -b "~/.local/bin/session-index.sh"'
run-shell -b '~/.local/bin/session-index.sh'

# ===========================================================================
# bawi user-keys: CSI sequences \e[900~ to \e[927~ intercepted in root table
# Ghostty/terminals send these, tmux routes to bawi
# ===========================================================================
set -s user-keys[0]  "\e[900~"
set -s user-keys[1]  "\e[901~"
set -s user-keys[2]  "\e[902~"
set -s user-keys[3]  "\e[903~"
set -s user-keys[4]  "\e[904~"
set -s user-keys[5]  "\e[905~"
set -s user-keys[6]  "\e[906~"
set -s user-keys[7]  "\e[907~"
set -s user-keys[8]  "\e[908~"
set -s user-keys[9]  "\e[909~"
set -s user-keys[10] "\e[910~"
set -s user-keys[11] "\e[911~"
set -s user-keys[12] "\e[912~"
set -s user-keys[13] "\e[913~"
set -s user-keys[14] "\e[914~"
set -s user-keys[15] "\e[915~"
set -s user-keys[16] "\e[916~"
set -s user-keys[17] "\e[917~"
set -s user-keys[18] "\e[918~"
set -s user-keys[19] "\e[919~"
set -s user-keys[20] "\e[920~"
set -s user-keys[21] "\e[921~"
set -s user-keys[22] "\e[922~"
set -s user-keys[23] "\e[923~"
set -s user-keys[24] "\e[924~"
set -s user-keys[25] "\e[925~"
set -s user-keys[26] "\e[926~"
set -s user-keys[27] "\e[927~"

# Window management
bind -T root User0  run-shell -b "/usr/local/bin/bawi window create"
bind -T root User1  run-shell -b "/usr/local/bin/bawi layout kill"
bind -T root User2  run-shell -b "/usr/local/bin/bawi window nav prev"
bind -T root User3  run-shell -b "/usr/local/bin/bawi window nav next"
bind -T root User4  run-shell -b "/usr/local/bin/bawi session nav prev"
bind -T root User5  run-shell -b "/usr/local/bin/bawi session nav next"

# Window switch (1-5)
bind -T root User6  run-shell -b "/usr/local/bin/bawi window switch 1"
bind -T root User7  run-shell -b "/usr/local/bin/bawi window switch 2"
bind -T root User8  run-shell -b "/usr/local/bin/bawi window switch 3"
bind -T root User9  run-shell -b "/usr/local/bin/bawi window switch 4"
bind -T root User10 run-shell -b "/usr/local/bin/bawi window switch 5"

# Splits
bind -T root User11 run-shell -b "/usr/local/bin/bawi layout split-h"
bind -T root User12 run-shell -b "/usr/local/bin/bawi layout split-v"

# Pane navigation
bind -T root User13 run-shell -b "/usr/local/bin/bawi pane nav left"
bind -T root User14 run-shell -b "/usr/local/bin/bawi pane nav right"
bind -T root User15 run-shell -b "/usr/local/bin/bawi pane nav up"
bind -T root User16 run-shell -b "/usr/local/bin/bawi pane nav down"

# Swap windows
bind -T root User17 run-shell -b "/usr/local/bin/bawi window swap prev"
bind -T root User18 run-shell -b "/usr/local/bin/bawi window swap next"

# Move window to another session
bind -T root User19 run-shell -b "/usr/local/bin/bawi window move prev"
bind -T root User20 run-shell -b "/usr/local/bin/bawi window move next"

# Swap panes
bind -T root User21 run-shell -b "/usr/local/bin/bawi pane swap left"
bind -T root User22 run-shell -b "/usr/local/bin/bawi pane swap right"
bind -T root User23 run-shell -b "/usr/local/bin/bawi pane swap up"
bind -T root User24 run-shell -b "/usr/local/bin/bawi pane swap down"

# Zoom pane
bind -T root User25 run-shell -b "/usr/local/bin/bawi pane zoom"

# Session rename
bind -T root User26 run-shell -b "/usr/local/bin/bawi session rename"

# Session create
bind -T root User27 run-shell -b "/usr/local/bin/bawi session create"

