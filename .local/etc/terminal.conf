# Terminal environment configuration
# Sourced by all scripts in ~/.local/bin/

# Terminal emulators (tried in order)
TERMINALS="Ghostty WezTerm"

# Screenshot
SCREENSHOT_OUT="/tmp/terminal-screenshot.jpg"
SCREENSHOT_QUALITY=65
SCREENSHOT_MAX_WIDTH=2560

# Statusbar capture
STATUSBAR_OUT="/tmp/statusbar.png"
STATUSBAR_HEIGHT=80
